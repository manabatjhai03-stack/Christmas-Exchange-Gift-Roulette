services:
  - type: web
    name: christmas-roulette
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: 1
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ACCESS_CODE_PEPPER
        sync: false
      - key: ADMIN_SETUP_TOKEN
        sync: false
